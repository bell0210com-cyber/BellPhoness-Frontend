<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2825" />
      <stop offset="100%" stop-color="#181715" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9bd86" />
      <stop offset="100%" stop-color="#be9a5d" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle Glow Circle -->
  <circle cx="200" cy="190" r="120" fill="#be9a5d" opacity="0.06" filter="blur(20px)" />
  
  <!-- Phone Silhouette -->
  <rect x="140" y="80" width="120" height="220" rx="24" fill="url(#phoneGrad)" stroke="#3a3732" stroke-width="2" />
  
  <!-- Dynamic Island / Speaker Notch -->
  <rect x="180" y="94" width="40" height="8" rx="4" fill="#0b0b0b" />
  
  <!-- Phone Inner Screen Area -->
  <rect x="148" y="112" width="104" height="174" rx="16" fill="#0d0d0d" opacity="0.8" />
  
  <!-- Minimal Camera Lens subtle hint -->
  <circle cx="200" cy="180" r="16" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.3" />
  <circle cx="200" cy="180" r="6" fill="url(#goldGrad)" opacity="0.4" />
  
  <!-- Brand Text -->
  <text x="200" y="340" font-family="Manrope, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.25em" fill="#88847e" text-anchor="middle">BELL</text>
</svg>
